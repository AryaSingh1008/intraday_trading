version: 0.2

env:
  variables:
    TF_VERSION: "1.5.7"
    TF_DIR: "infrastructure/terraform"
    TF_VAR_aws_region: "us-east-1"
    TF_VAR_project_name: "trading"
    TF_VAR_environment: "prod"
    TF_VAR_lambda_layers_built: "true"
  parameter-store:
    TF_STATE_BUCKET: /trading/tf-state-bucket
    TF_VAR_aws_account_id: /trading/aws-account-id

phases:
  install:
    commands:
      - |
        wget -q "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
        unzip -q "terraform_${TF_VERSION}_linux_amd64.zip"
        mv terraform /usr/local/bin/
        terraform version

  pre_build:
    commands:
      - |
        terraform -chdir=${TF_DIR} init \
          -backend-config="bucket=${TF_STATE_BUCKET}" \
          -backend-config="key=trading/terraform.tfstate" \
          -backend-config="region=us-east-1" \
          -input=false
      - terraform -chdir=${TF_DIR} validate

  build:
    commands:
      - |
        terraform -chdir=${TF_DIR} plan \
          -var="lambda_layers_built=true" \
          -out=tfplan \
          -input=false
      - echo "Terraform plan complete"

artifacts:
  files:
    - infrastructure/terraform/tfplan
    - infrastructure/terraform/.terraform.lock.hcl
    - infrastructure/terraform/**/*
    - infrastructure/buildspec/**/*
    - infrastructure/appspec/**/*
    - infrastructure/layers/**/*
    - frontend/**/*
    - lambdas/**/*
    - backend/**/*
    - prompts/**/*
  discard-paths: no
