version: 0.2

env:
  parameter-store:
    FRONTEND_BUCKET: /trading/frontend-bucket
    CLOUDFRONT_DISTRIBUTION_ID: /trading/cloudfront-dist-id

phases:
  build:
    commands:
      # Sync all assets except index.html with long-lived immutable cache headers
      - |
        aws s3 sync frontend/ "s3://${FRONTEND_BUCKET}/" \
          --delete \
          --cache-control "public, max-age=31536000, immutable" \
          --exclude "index.html" \
          --region us-east-1

      # index.html must never be cached so users always get the latest version
      - |
        aws s3 cp frontend/index.html "s3://${FRONTEND_BUCKET}/index.html" \
          --cache-control "no-cache, no-store, must-revalidate" \
          --content-type "text/html" \
          --region us-east-1

      # Invalidate CloudFront so the CDN serves the new files immediately
      - |
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
          --paths "/*" \
          --query Invalidation.Id --output text)
        echo "CloudFront invalidation created: ${INVALIDATION_ID}"

  post_build:
    commands:
      - echo "Frontend deployment complete at $(date)"
