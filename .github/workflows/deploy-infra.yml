name: Deploy Infrastructure (Terraform)

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
      - "lambdas/**"
      - "prompts/**"
      - "backend/agents/**"
      - ".github/workflows/**"
  workflow_dispatch :   

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: infrastructure/terraform
  TF_VAR_aws_region: us-east-1
  TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_project_name: trading
  TF_VAR_environment: prod
  TF_VAR_lambda_layers_built: "true"

jobs:
  plan:
    name: Terraform Plan
    if: false   # Disabled — AWS CodePipeline owns infra deployments now
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda layers
        run: |
          chmod +x infrastructure/build_layers.sh
          ./infrastructure/build_layers.sh

      - name: Upload layer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-layers
          path: infrastructure/layers/
          retention-days: 1
          include-hidden-files: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=trading/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -out=tfplan -input=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    name: Terraform Apply
    if: false   # Disabled — AWS CodePipeline owns infra deployments now
    runs-on: ubuntu-latest
    needs: plan
    environment: terraform_apply

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download layer artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-layers
          path: infrastructure/layers/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=trading/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false tfplan

      - name: Force-deploy Lambda code (bypass Terraform hash drift)
        run: |
          for dir in lambdas/trading_*/; do
            name=$(basename "$dir")
            fn_name="${name//_/-}"
            zip_file="/tmp/${name}.zip"
            cd "$dir" && zip -r "$zip_file" . --exclude "__pycache__/*" "*.pyc" ".DS_Store" && cd -
            aws lambda update-function-code \
              --function-name "$fn_name" \
              --region us-east-1 \
              --zip-file "fileb://${zip_file}" \
              --no-cli-pager
            echo "Deployed $fn_name"
          done
